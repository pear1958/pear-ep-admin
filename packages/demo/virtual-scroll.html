<!doctype html>
<html>
  <head>
    <style>
      .scroll-container {
        height: 400px; /* 可视区域高度 */
        overflow: auto;
        position: relative;
        border: 1px solid red;
      }
      /* .placeholder {
        高度由JS动态设置（totalCount × itemHeight）
      } */
      .render-area {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
      .list-item {
        height: 50px;
        line-height: 50px;
        border-bottom: 1px solid green;
      }
    </style>
  </head>
  <body>
    <div class="scroll-container" id="scrollContainer">
      <div class="placeholder" id="placeholder"></div>
      <div class="render-area" id="renderArea"></div>
    </div>

    <script>
      // 1. 模拟10万条数据
      const totalCount = 100000
      const totalData = Array.from({ length: totalCount }, (_, i) => `列表项 ${i + 1}`)

      // 2. 基础参数
      const scrollContainer = document.getElementById('scrollContainer')
      const placeholder = document.getElementById('placeholder')
      const renderArea = document.getElementById('renderArea')
      
      const containerHeight = scrollContainer.clientHeight // 400px
      const itemHeight = 50 // 固定项高度
      const bufferCount = 2 // 缓冲数量

      // 3. 初始化：设置占位高度 -> 显示滚动条
      const totalHeight = totalCount * itemHeight
      placeholder.style.height = `${totalHeight}px`

      // 4. 节流函数（16ms，对应60fps）
      function throttle(fn, delay = 16) {
        let lastTime = 0
        return (...args) => {
          const now = Date.now()
          if (now - lastTime >= delay) {
            fn.apply(this, args)
            lastTime = now
          }
        }
      }

      // 5. 核心渲染函数
      function render() {
        // 5.1 获取滚动距离 -> 元素内容向上滚动的像素数
        const scrollTop = scrollContainer.scrollTop

        // 渲染区域可见的数量
        const visibleCount = Math.ceil(containerHeight / itemHeight)

        // 5.2 计算索引
        const startIndex = Math.max(0, Math.floor(scrollTop / itemHeight)) // 避免负索引
        const endIndex = Math.min(totalCount, startIndex + visibleCount + bufferCount)

        // 5.3 截取数据
        const renderData = totalData.slice(startIndex, endIndex)

        // 5.4 定位渲染区域
        renderArea.style.top = `${startIndex * itemHeight}px`

        // 5.5 渲染内容（复用DOM，这里简化为innerHTML，实际项目需优化）
        renderArea.innerHTML = renderData
          .map(item => `<div class="list-item">${item}</div>`)
          .join('')
      }

      // 6. 监听滚动事件（节流）
      scrollContainer.addEventListener('scroll', throttle(render))

      // 7. 首次渲染
      render()
    </script>
  </body>
</html>
