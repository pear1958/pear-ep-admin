<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>不定高虚拟滚动列表</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      h1 {
        color: #333;
        margin: 20px 0;
        text-align: center;
      }

      /* 外层容器：固定高度+滚动，作为所有子元素的定位父级 */
      #outerContainer {
        height: 500px;
        border: 1px solid #ddd;
        background: white;
        overflow-y: auto;
        position: relative;
      }

      /* 1. 滚动占位容器：用总高度撑起外层的滚动条 */
      #scrollPlaceholder {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }

      /* 2. 可视区域容器：只渲染可见item */
      #visibleContainer {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
      }

      .list-item {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
      }

      .list-item:hover {
        background: #f9f9f9;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #666;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>不定高虚拟滚动列表</h1>

      <!-- 外层容器：固定高度+滚动，作为所有子元素的定位父级 -->
      <div id="outerContainer">
        <!-- 1. 滚动占位容器：嵌套在内部，用总高度撑起外层的滚动条 -->
        <div id="scrollPlaceholder"></div>
        <!-- 2. 可视区域容器：嵌套在内部，绝对定位后覆盖在占位容器上方，只渲染可见item -->
        <div id="visibleContainer"></div>
      </div>

      <div class="status">
        <div>
          总数据量:
          <span id="totalCount">1000</span>
        </div>
        <div>
          当前渲染:
          <span id="renderedCount">0</span>
        </div>
      </div>
    </div>

    <script>
      // -------------------------- 1. 定义核心变量（存储状态和DOM） --------------------------
      // 外层容器（滚动触发者）
      const outerContainer = document.getElementById('outerContainer')
      // 占位容器（撑滚动条用）
      const scrollPlaceholder = document.getElementById('scrollPlaceholder')
      // 可视区域容器（渲染可见item）
      const visibleContainer = document.getElementById('visibleContainer')
      const totalCountEl = document.getElementById('totalCount')
      const renderedCountEl = document.getElementById('renderedCount')

      // 模拟海量列表数据
      const totalCount = 1000
      const listData = Array.from({ length: totalCount }, (_, i) => `列表项 ${i + 1}`)
      // 缓存每个item的真实高度
      const itemHeightCache = new Array(listData.length).fill(0)
      // 预估item高度
      const estimatedItemHeight = 80
      // 可视区域能容纳的item数量
      let visibleItemCount = Math.ceil(outerContainer.clientHeight / estimatedItemHeight)
      // 预加载数量
      const preloadCount = 3
      // 总高度
      let totalHeight = 0

      // -------------------------- 2. 初始化虚拟滚动 --------------------------
      function initVirtualScroll() {
        // 计算初始要渲染的item范围
        const startIndex = 0
        const endIndex = Math.min(startIndex + visibleItemCount + preloadCount, listData.length)

        // 渲染初始范围内的item
        renderVisibleItems(startIndex, endIndex)

        // 绑定滚动事件
        outerContainer.addEventListener('scroll', handleScroll)

        // 绑定窗口 resize 事件
        window.addEventListener('resize', handleResize)
      }

      // -------------------------- 3. 滚动事件处理（核心逻辑） --------------------------
      function handleScroll() {
        // 获取当前滚动距离
        const scrollTop = outerContainer.scrollTop

        // 计算当前滚动位置对应的起始索引
        let startIndex = 0
        let accumulatedHeight = 0

        for (let i = 0; i < itemHeightCache.length; i++) {
          accumulatedHeight += itemHeightCache[i] || estimatedItemHeight
          if (accumulatedHeight > scrollTop) {
            startIndex = i
            break
          }
        }

        // 计算结束索引
        const endIndex = Math.min(startIndex + visibleItemCount + preloadCount, listData.length)

        // 渲染当前可视范围内的item
        renderVisibleItems(startIndex, endIndex)

        // 调整可视容器的top位置（已改回使用style.top）
        const offsetTop = itemHeightCache
          .slice(0, startIndex)
          .reduce((sum, h) => sum + (h || estimatedItemHeight), 0)
          
        visibleContainer.style.top = `${offsetTop}px`
      }

      // -------------------------- 4. 渲染可视区域的item --------------------------
      function renderVisibleItems(startIndex, endIndex) {
        // 清空可视容器
        visibleContainer.innerHTML = ''

        // 遍历要渲染的item范围
        for (let i = startIndex; i < endIndex; i++) {
          const item = document.createElement('div')
          item.className = 'list-item'

          // 生成随机高度内容
          const randomLines = Math.floor(Math.random() * 3) + 1
          let content = `${listData[i]}<br>`
          for (let j = 0; j < randomLines; j++) {
            content += `这是第${j + 1}行内容，用于模拟不定高元素<br>`
          }
          item.innerHTML = content

          visibleContainer.appendChild(item)

          // 测量并缓存item的真实高度
          requestAnimationFrame(() => {
            const realHeight = item.offsetHeight
            if (itemHeightCache[i] !== realHeight) {
              itemHeightCache[i] = realHeight
              updateTotalHeight()
            }
          })
        }

        // 更新状态显示
        renderedCountEl.textContent = endIndex - startIndex
      }

      // -------------------------- 5. 更新总高度 --------------------------
      function updateTotalHeight() {
        totalHeight = itemHeightCache.reduce((sum, h) => sum + (h || estimatedItemHeight), 0)
        scrollPlaceholder.style.height = `${totalHeight}px`
      }

      // -------------------------- 6. 窗口 resize 处理 --------------------------
      function handleResize() {
        visibleItemCount = Math.ceil(outerContainer.clientHeight / estimatedItemHeight)
        handleScroll()
      }

      // -------------------------- 7. 启动虚拟滚动 --------------------------
      initVirtualScroll()
    </script>
  </body>
</html>
